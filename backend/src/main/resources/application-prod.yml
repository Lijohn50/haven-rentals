spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://loki:loki1234@spring.3lufpl6.mongodb.net/rentals?appName=spring}

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.example.rentals: INFO
