  <path d="M0 560c160-56 300 22 450-6 170-32 260 40 410 22 150-18 220 30 330 20 130-12 260 26 410 6v320H0z" fill="#2dd4bf" opacity="0.7" />

  <path d="M0 690c200-40 320 30 500 8 180-22 280 34 430 20 160-16 260 22 390 8 90-10 170 6 280 2v172H0z" fill="url(#sea)" />

